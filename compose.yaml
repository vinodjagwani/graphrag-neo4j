services:
  neo4j:
    image: neo4j:2026.10.2-community
    ports:
      - "7474:7474"   # Neo4j Browser: http://localhost:7474
      - "7687:7687"   # Bolt
    environment:
      NEO4J_AUTH: neo4j/demo-password
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "demo-password", "RETURN 1"]
      interval: 5s
      timeout: 5s
      retries: 30
